[project]
name = "dynamicllmrouting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "mypy>=2.3.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]
[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["BLE001"]
