openapi: 3.0.3
info:
  title: SmartRouter API
  description: |
    OpenAI-compatible LLM routing proxy. SmartRouter intercepts chat completion
    requests, scores them with an ML classifier, and routes them to the most
    cost-effective model tier. Supports shadow mode, PII redaction, jailbreak
    blocking, semantic caching, context compression with rolling summarization,
    budget circuit breaking, and per-request routing preference overrides.
  version: 0.3.0
servers:
  - url: http://localhost:8080/v1
paths:
  /chat/completions:
    post:
      summary: Create a chat completion
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      parameters:
        - in: header
          name: X-SmartRouter-Shadow
          schema:
            type: boolean
          required: false
          description: If true, calculates the routing score and logs it, but always routes to the Smart tier.
      responses:
        '200':
          description: Successful response
          headers:
            X-SmartRouter-Model:
              schema:
                type: string
              description: The internal model that the router decided to use
            X-SmartRouter-Score:
              schema:
                type: number
              description: The complexity score (0.0 to 1.0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
  /usage:
    get:
      summary: Get router cost savings report
      operationId: getUsageReport
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReportResponse'
components:
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
      required:
        - role
        - content

    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
          nullable: true
          description: "ID of the model to use. SmartRouter intercepts this and routes to the optimal tier."
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          default: 1.0
        max_tokens:
          type: integer
          nullable: true
        stream:
          type: boolean
          default: false
        response_format:
          $ref: '#/components/schemas/ResponseFormat'
          nullable: true
        routing_preference:
          $ref: '#/components/schemas/RoutingPreference'
      required:
        - messages

    ResponseFormat:
      type: object
      properties:
        type:
          type: string
          enum: [text, json_object]
          default: text
      required:
        - type

    RoutingPreference:
      type: string
      enum: [auto, frontier_only, economy]
      default: auto
      description: |
        Controls how SmartRouter selects a tier for this request.
        - `auto` (default): ML classifier selects the optimal tier.
        - `frontier_only`: Always routes to the Smart (most capable) tier, bypassing the classifier.
        - `economy`: Always routes to the Cheap tier, bypassing the classifier.

    ChatCompletionChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
          nullable: true
      required:
        - index
        - message

    ChatCompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          default: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          $ref: '#/components/schemas/ChatCompletionUsage'
      required:
        - id
        - object
        - created
        - model
        - choices

    UsageReportResponse:
      type: object
      properties:
        total_requests:
          type: integer
          description: Total number of requests routed since startup.
        total_spent_usd:
          type: number
          description: Actual cumulative spend in USD.
        hypothetical_spent_usd:
          type: number
          description: What spend would have been if all requests went to the Smart tier.
        total_saved_usd:
          type: number
          description: Savings achieved (hypothetical minus actual).
        shadow_mode_active:
          type: boolean
          description: Whether shadow mode is currently enabled globally.
      required:
        - total_requests
        - total_spent_usd
        - hypothetical_spent_usd
        - total_saved_usd
        - shadow_mode_active
